<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>杨淳宁 · 个人主页</title>
<style>
  :root {
    --primary: #1F4E79;
    --primary-dark: #163A5A;
    --bg: #FAF7F1;
    --card-bg: #FFFFFF;
    --text: #2B2B2B;
    --text-muted: #6B7280;
    --border: #E8E2D8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    background-color: var(--bg);
    color: var(--text);
    line-height: 1.75;
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
  }
  /* ---------- 头部 ---------- */
  .header {
    background-color: var(--primary);
    color: #FFFFFF;
    text-align: center;
    padding: 56px 24px 48px;
  }
  .avatar {
    width: 108px;
    height: 108px;
    border-radius: 50%;
    margin: 0 auto 20px;
    background: linear-gradient(140deg, #3C7CB3 0%, #2A6394 100%);
    border: 3px solid rgba(255, 255, 255, 0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 42px;
    font-weight: 500;
    letter-spacing: 2px;
    color: rgba(255, 255, 255, 0.92);
    user-select: none;
  }
  .header h1 {
    font-size: 28px;
    font-weight: 600;
    letter-spacing: 3px;
  }
  .header .subtitle {
    margin-top: 8px;
    font-size: 15px;
    color: rgba(255, 255, 255, 0.78);
    letter-spacing: 1px;
  }
  /* ---------- 主体 ---------- */
  .main {
    max-width: 860px;
    margin: 0 auto;
    padding: 48px 24px 64px;
  }
  .intro {
    font-size: 16px;
    color: #44403C;
    text-align: center;
    max-width: 640px;
    margin: 0 auto 52px;
  }
  .section-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--primary);
    letter-spacing: 2px;
    text-align: center;
    margin-bottom: 28px;
    position: relative;
  }
  .section-title::after {
    content: "";
    display: block;
    width: 36px;
    height: 2px;
    background-color: var(--primary);
    opacity: 0.5;
    margin: 12px auto 0;
  }
  /* ---------- 卡片 ---------- */
  .cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 22px;
  }
  .card {
    background-color: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px 24px;
    transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    will-change: transform;
  }
  .card:hover {
    transform: translateY(-6px);
    box-shadow: 0 12px 28px rgba(31, 78, 121, 0.14);
    border-color: #D6E0EA;
  }
  .card h3 {
    font-size: 17px;
    font-weight: 600;
    color: var(--primary);
    margin-bottom: 12px;
    line-height: 1.5;
  }
  .card p {
    font-size: 14px;
    color: var(--text-muted);
    line-height: 1.8;
  }
  /* ---------- 底部 ---------- */
  .footer {
    background-color: var(--primary);
    color: rgba(255, 255, 255, 0.82);
    text-align: center;
    padding: 32px 24px;
    font-size: 14px;
  }
  .footer .label {
    color: rgba(255, 255, 255, 0.6);
    font-size: 13px;
    margin-bottom: 6px;
    letter-spacing: 1px;
  }
  .footer a {
    color: #FFFFFF;
    text-decoration: none;
    border-bottom: 1px solid rgba(255, 255, 255, 0.4);
    padding-bottom: 2px;
    transition: border-color 0.2s ease, opacity 0.2s ease;
    word-break: break-all;
  }
  .footer a:hover {
    border-color: #FFFFFF;
  }
  /* ---------- 移动端 ---------- */
  @media (max-width: 768px) {
    .cards { grid-template-columns: 1fr; gap: 16px; }
    .header { padding: 44px 20px 38px; }
    .header h1 { font-size: 24px; }
    .avatar { width: 92px; height: 92px; font-size: 36px; }
    .main { padding: 36px 20px 48px; }
    .intro { margin-bottom: 40px; }
  }
  @media (max-width: 380px) {
    body { font-size: 15px; }
    .header h1 { font-size: 22px; letter-spacing: 2px; }
  }
</style>
</head>
<body>
  <header class="header">
    <div class="avatar" aria-hidden="true">杨</div>
    <h1>杨淳宁</h1>
    <p class="subtitle">复旦大学金融专硕</p>
  </header>
  <main class="main">
    <p class="intro">
      金融专硕在读，关注宏观经济、资产定价与量化研究，擅长数据分析与代码建模。
    </p>
    <h2 class="section-title">项目经历</h2>
    <div class="cards">
      <article class="card">
        <h3>宏观资产因子回测</h3>
        <p>基于 A 股与国债数据构建多因子模型，检验动量与价值因子收益特征。</p>
      </article>
      <article class="card">
        <h3>家庭金融面板数据分析</h3>
        <p>使用 CFPS 微观数据库，研究家庭资产配置与风险偏好。</p>
      </article>
      <article class="card">
        <h3>事件研究法实证工具</h3>
        <p>Python 实现事件研究法，计算累计超额收益 CAR，支持批量个股回测。</p>
      </article>
    </div>
  </main>
  <footer class="footer">
    <p class="label">联系方式</p>
    <p><a href="mailto:26210680160@m.fudan.edu.cn">26210680160@m.fudan.edu.cn</a></p>
  </footer>
</body>
</html>
